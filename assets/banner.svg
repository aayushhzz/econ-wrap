<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="econ-wrap — Experience-Driven Black-Box Cost Control for Coding Agents">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#13162D"/>
      <stop offset="100%" stop-color="#1A1536"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#bg)" stroke="#27274A" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#dots)" opacity="0.65"/>
  <circle cx="184" cy="160" r="145" fill="url(#glow)"/>

  <!-- Emblem: Cumulative Token Curve Crossing Below Baseline (Break-Even) + 3 Lever Nodes -->
  <g transform="translate(84, 66)">
    <rect x="0" y="0" width="196" height="188" rx="16" fill="#0D1224" stroke="#2D3158" stroke-width="2"/>

    <!-- Chart axes -->
    <line x1="26" y1="154" x2="172" y2="154" stroke="#334155" stroke-width="1.5"/>
    <line x1="26" y1="30" x2="26" y2="154" stroke="#334155" stroke-width="1.5"/>

    <!-- Baseline curve (dashed rose/slate, steep) -->
    <path d="M 32 146 L 78 112 L 124 76 L 168 38" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.8"/>

    <!-- Controlled curve (amber -> emerald, starts slightly above then crosses below) -->
    <path d="M 32 138 C 64 114, 92 98, 114 84 C 136 72, 152 67, 168 63" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

    <!-- Break-even crossover highlight -->
    <circle cx="114" cy="84" r="9" fill="#10B981" opacity="0.25"/>
    <circle cx="114" cy="84" r="4.5" fill="#34D399" stroke="#0B1120" stroke-width="1.5"/>

    <!-- 3 Lever indicators at top right -->
    <circle cx="130" cy="24" r="5" fill="#F59E0B"/>
    <circle cx="148" cy="24" r="5" fill="#10B981"/>
    <circle cx="166" cy="24" r="5" fill="#818CF8"/>
  </g>

  <!-- Text -->
  <g transform="translate(324, 102)">
    <rect x="0" y="-32" width="236" height="26" rx="13" fill="#818CF8" fill-opacity="0.16" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="118" y="-14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.1" fill="#A5B4FC">TOKENECONOMIZER · PYTHON 3.9+</text>

    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">econ-wrap</text>
    <text x="2" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Experience-Driven Black-Box Cost Control for Coding Agents</text>

    <!-- Feature pills -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="134" height="30" rx="8" fill="#1E243B" stroke="#3B4261" stroke-width="1"/>
      <text x="67" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FCD34D">Micro-Skills</text>

      <rect x="146" y="0" width="134" height="30" rx="8" fill="#1E243B" stroke="#3B4261" stroke-width="1"/>
      <text x="213" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6EE7B7">Tool Pruning</text>

      <rect x="292" y="0" width="134" height="30" rx="8" fill="#1E243B" stroke="#3B4261" stroke-width="1"/>
      <text x="359" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#C4B5FD">Loop Guard</text>

      <rect x="438" y="0" width="150" height="30" rx="8" fill="#1E243B" stroke="#3B4261" stroke-width="1"/>
      <text x="513" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">Stdlib-Only Core</text>
    </g>
  </g>
</svg>
